<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Prezident O'yini</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin-top: 10px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #00ff00; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        #output { font-size: 20px; margin-top: 20px; white-space: pre-line; }
        canvas { margin-top: 20px; background-color: #000; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div id="game">
        <h2 style="color: #00ffff;">Savol yuklanmoqda... 🤔</h2>
        <p id="question">O'zbekiston Respublikasi Prezidentining ism va familiyasini yozing:</p>
        <input type="text" id="answer" placeholder="Ism va familiya...">
        <button onclick="checkAnswer()">Yuborish</button>
        <div id="output"></div>
    </div>
    <canvas id="heartCanvas" width="400" height="400" style="display:none;"></canvas>

    <script>
        function checkAnswer() {
            let ans = document.getElementById("answer").value.trim().toUpperCase();
            let out = document.getElementById("output");
            if (ans === "SHAVKAT MIRZIYOYEV") {
                out.innerHTML = "<span style='color:#00ff00;'>Barakalla! To'g'ri topdingiz! 🌟</span><br>Sizga maxsus sovg'a tayyorlanmoqda...";
                document.getElementById("answer").style.display = "none";
                document.querySelector("button").style.display = "none";
                setTimeout(startRocket, 2000);
            } else {
                out.innerHTML = "<span style='color:#ff0000;'>Shuniyam bilmaysanmi? Qaytadan urinib ko'r! ❌</span>";
            }
        }
        function startRocket() {
            let out = document.getElementById("output");
            let count = 5;
            let timer = setInterval(() => {
                out.innerHTML = `<span style='color:#00ffff;'>🔥 MANA SIZGA ZO'R SOVG'A: KOSMIK RAKETA UCHISHI! 🔥</span><br><span style='color:#ffff00;'>Oynani tayyorlash: ${count}...</span>`;
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    out.innerHTML = "<span style='color:#ff0000;'>🚀 POYGA BOSHLANDI!!!<br>Tabriklayman! Loyihani daxshat bajardingiz! 🏆</span>";
                    setTimeout(drawHeart, 2000);
                }
            }, 1000);
        }
        function drawHeart() {
            document.getElementById("game").style.display = "none";
            let canvas = document.getElementById("heartCanvas");
            canvas.style.display = "block";
            let ctx = canvas.getContext("2d");
            ctx.translate(200, 200);
            ctx.strokeStyle = "red";
            ctx.fillStyle = "pink";
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let t = 0; t < Math.PI * 2; t += 0.01) {
                let x = 16 * Math.pow(Math.sin(t), 3) * 10;
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 10;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.fill();
        }
    </script>
</body>
</html>
