<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Birinchi Dasturim</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e1b4b); 
            color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { 
            background-color: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            width: 100%;
            max-width: 500px; 
            padding: 35px 25px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h2 { 
            color: #38bdf8; 
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        p {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        input { 
            padding: 14px 20px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: 2px solid #334155; 
            background-color: #0f172a;
            color: #fff;
            margin-top: 5px; 
            width: 100%; 
            text-align: center; 
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        button { 
            padding: 14px 20px; 
            font-size: 16px; 
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #052e16;
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%;
            font-weight: bold; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        #output { 
            font-size: 18px; 
            margin-top: 25px; 
            white-space: pre-line; 
            line-height: 1.8; 
            text-align: left;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 4px solid #38bdf8;
        }
        .hidden { display: none; }
        .success-text { color: #4ade80; font-weight: bold; }
        .error-text { color: #f87171; font-weight: bold; }
        .rocket-art {
            font-family: monospace;
            color: #f87171;
            font-size: 14px;
            line-height: 1.3;
            text-align: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="game-box">
            <h2 id="status-text">Dastur yuklanmoqda... 🤔</h2>
            <div id="input-area">
                <p id="question-text"></p>
                <input type="text" id="user-input" placeholder="">
                <button id="submit-btn" onclick="processStep()">Yuborish</button>
            </div>
            <div id="output" class="hidden"></div>
        </div>
    </div>

    <script>
        let step = 1;
        let userName = "";
        let birthYear = "";
        let firstNum = 0;
        let secondNum = 0;
        let temperature = 0;
        
        const statusText = document.getElementById("status-text");
        const userInput = document.getElementById("user-input");
        const submitBtn = document.getElementById("submit-btn");
        const output = document.getElementById("output");
        const inputArea = document.getElementById("input-area");
        const questionText = document.getElementById("question-text");

        // Dastur boshlanishi
        statusText.innerText = "1-bosqich: Tanishuv";
        questionText.innerText = "Keling, avval tanishib olamiz!";
        userInput.placeholder = "Ismingizni yozing...";

        // Enter tugmasi bosilganda ham yuborish ishlashi uchun
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                processStep();
            }
        });

        function showOutput(text) {
            output.classList.remove("hidden");
            output.innerHTML += text + "\n";
        }

        function processStep() {
            let val = userInput.value.trim();
            if (val === "" && step !== 6) return;

            if (step === 1) {
                userName = val;
                showOutput(`👋 hush kebsan ${userName}`);
                userInput.value = "";
                inputArea.classList.add("hidden");
                
                setTimeout(() => {
                    inputArea.classList.remove("hidden");
                    statusText.innerText = "2-bosqich: Yoshni hisoblash";
                    questionText.innerText = "Tug'ilgan yilingizni kiriting:";
                    userInput.placeholder = "Masalan: 2005";
                    step = 2;
                }, 2000);

            } else if (step === 2) {
                birthYear = parseInt(val);
                if (isNaN(birthYear)) {
                    alert("Iltimos, yilni raqamda kiriting!");
                    return;
                }
                let age = 2026 - birthYear;
                showOutput(`📅 Sen ${age} yoshdasan.`);
                userInput.value = "";
                inputArea.classList.add("hidden");

                setTimeout(() => {
                    inputArea.classList.remove("hidden");
                    statusText.innerText = "3-bosqich: Kalkulyator";
                    questionText.innerText = "Matematika chalindji! Birinchi sonni yozing:";
                    userInput.placeholder = "Hohlagan raqam yoz...";
                    step = 3;
                }, 2000);

            } else if (step === 3) {
                firstNum = parseFloat(val);
                if (isNaN(firstNum)) { firstNum = 0; }
                userInput.value = "";
                questionText.innerText = "Yana bitta boshqa raqam yozing:";
                userInput.placeholder = "Ikkinchi raqam...";
                step = 4;

            } else if (step === 4) {
                secondNum = parseFloat(val);
                if (isNaN(secondNum)) { secondNum = 0; }
                let sum = firstNum + secondNum;
                showOutput(`🧮 jami qo'shilganda: ${sum}`);
                userInput.value = "";
                inputArea.classList.add("hidden");

                setTimeout(() => {
                    inputArea.classList.remove("hidden");
                    statusText.innerText = "4-bosqich: Ob-havo";
                    questionText.innerText = "Hozir yashayotgan joyingda nechi gradus issiq?";
                    userInput.placeholder = "Haroratni raqamda yozing...";
                    step = 5;
                }, 2000);

            } else if (step === 5) {
                if (isNaN(parseFloat(val))) {
                    alert("Iltimos, faqat raqam yozing!");
                    userInput.value = "";
                    return;
                }
                temperature = parseFloat(val);
                userInput.value = "";
                
                if (temperature < 25) {
                    showOutput("🌡️ koreadan sovuqroq ekan!");
                } else if (temperature >= 30) {
                    showOutput("🌡️ issiq ekan, qorayib ket.");
                } else {
                    showOutput("🌡️ unchalik issiqmas ekan kochaga chiqib yugurib kel!");
                }
                inputArea.classList.add("hidden");

                setTimeout(() => {
                    inputArea.classList.remove("hidden");
                    statusText.innerText = "5-bosqich: Siyosat o'yini";
                    questionText.innerText = "O'zbekiston Respublikasi Prezidentining ism va familiyasini yoz:";
                    userInput.placeholder = "Prezident ismi...";
                    step = 6;
                }, 2000);

            } else if (step === 6) {
                if (val.toUpperCase() === "SHAVKAT MIRZIYOYEV") {
                    showOutput("<span class='success-text'>yaxshi! 🌟</span>");
                    userInput.value = "";
                    inputArea.classList.add("hidden");
                    
                    setTimeout(() => {
                        showOutput("🎁 To'g'ri topganing uchun maxsus sovg'a tayyorlanmoqda...");
                        setTimeout(startRocket, 2000);
                    }, 2000);
                } else {
                    showOutput("<span class='error-text'>Shuniyam bilmaysanmi? Qaytadan urinib ko'r! ❌</span>");
                    userInput.value = "";
                }
            }
        }

        function startRocket() {
            showOutput("\n🔥 MANA SENGA SOVG'A: RAKETA! 🔥");
            let count = 5;
            let timer = setInterval(() => {
                showOutput(`⏱️ hozir boshlanadi: ${count}...`);
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    output.innerHTML += `
<div class="rocket-art">🚀
    /\\
   /  \\

  |    |
  |    |
 /|    |\\
/_|_  _|_\\

   |  |
   |  |
  /____\\
  vvvvvv
 🔥🔥🔥🔥🔥</div>
